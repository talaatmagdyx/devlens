[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devlens"
version = "0.2.0"
description = "Evidence-first engineering analysis for a single operator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "hypothesis>=6.100,<7",
    "pyyaml>=6,<7",
]

[project.scripts]
devlens = "devlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

# The compiled UI ships inside the package, so an installed wheel and a
# container image serve it without DEVLENS_UI_DIR. The image sets that variable
# as well, because a missing UI should be a configuration error rather than a
# silent 404.
[tool.setuptools.package-data]
devlens = ["web/dist/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["legacy", "build", ".venv", "web"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: makes a real network call to a live provider; skipped with a stated reason when unavailable",
]
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
branch = true
source = ["devlens"]
omit = ["*/__main__.py"]

[tool.coverage.report]
# The gate is set to the level the suite actually holds. Raising it is a change
# to this line plus the tests that earn it — never a change to this line alone.
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/legacy", "build", "web"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "S",    # bandit
    "ASYNC",
    "RUF",
]
ignore = [
    "S101",  # assert is how the tests are written
    "E501",  # long lines are caught by the formatter, not the linter
    "B008",  # FastAPI dependencies are function calls in defaults by design
    "SIM108",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately hold fake credentials, shell out to git, and use
# temporary paths; the security rules that flag those are noise here.
"tests/*" = [
    "S105", "S106", "S108", "S311", "S603", "S607", "B017",
    # A test may block the loop it owns; nothing else is waiting on it.
    "ASYNC230", "ASYNC221",
]

[tool.ruff.lint.isort]
known-first-party = ["devlens"]

[tool.mypy]
python_version = "3.11"
files = ["src/devlens"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# Strictness is raised deliberately, module by module, as annotations land.
# Claiming a level the code does not hold would be the same failure the audit
# found in the README.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["devlens.domain", "devlens.evidence", "devlens.policies", "devlens.guardrails"]
disallow_untyped_defs = true
