# A single-operator deployment. Nothing here is multi-tenant: use the hosted
# entry point (devlens.app.saas:app) if DevLens is reachable by more than the
# person who started it.
services:
  devlens:
    build: .
    image: devlens:local
    ports:
      # Loopback only. The local application authenticates one operator with one
      # shared password; that is not an authentication boundary for a network.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DEVLENS_JOBS_DB: /data/jobs.sqlite
      DEVLENS_ANALYZE_ROOT: /workspace
    volumes:
      - devlens-data:/data
      # Read-only: DevLens analyses a checkout, it does not modify one.
      - ./workspace:/workspace:ro
    restart: unless-stopped

    # Containment. DevLens reads repositories and tickets that it treats as
    # hostile input, so the container it runs in is bounded rather than trusted.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if b'ok' in urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read() else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  devlens-data:
